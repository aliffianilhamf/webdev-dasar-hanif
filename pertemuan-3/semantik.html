<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Semantic HTML</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 15px;
        }

        nav {
            background: #e2e8f0;
            padding: 10px;
        }

        main {
            padding: 20px;
        }

        footer {
            background: #334155;
            color: white;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <h1>Website Blog Semantik</h1>
    </header>

    <nav>
        <a href="#">Beranda</a> | <a href="#">Tentang</a> | <a href="#">Kontak</a>
    </nav>

    <main>
        <article>
            <h2>Kenapa Belajar HTML5?</h2>
            <p>HTML5 membuat struktur web lebih bermakna dan mudah dibaca oleh mesin.</p>
        </article>

        <section>
            <h3>Komentar Pembaca</h3>
            <p>Belum ada komentar.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Belajar WebDev.</p>
    </footer>
</body>

</html>
