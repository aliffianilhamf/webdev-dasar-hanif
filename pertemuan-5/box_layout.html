<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Layout CSS</title>
    <style>
        div {
            border: 2px solid black;
            margin: 20px 30px 40px 50px;
        }

        .kotak_pertama {
            margin-bottom: 30px;
            padding-top: 50px;
            padding-left: 20px;
            padding-bottom: 50px;
            border: 20px dashed red
        }

        .kotak_kedua {
            padding: 40px 0px;
            border: 5px dotted blue
        }

        .kotak_ketiga {
            padding: 20px;
            border: 9px double orange
        }
    </style>
</head>

<body>
    <div class="kotak_pertama">Ini isi konten dari kotak 1</div>
    <div class="kotak_kedua">Ini isi konten dari kotak 2</div>
    <div class="kotak_ketiga">Ini isi konten dari kotak 3</div>
</body>

</html>
