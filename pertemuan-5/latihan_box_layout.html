<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Layout CSS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        section {
            display: flex;
            width: 100%;
            flex-wrap: wrap;
        }

        div {
            box-sizing: border-box;
            width: 375px;
            border: 2px solid black;
            padding: 10px;
        }

        .kotak_pertama {}

        .kotak_kedua {}

        .kotak_ketiga {}
    </style>
</head>

<body>
    <section>
        <div class="kotak_pertama">kotak 1</div>
        <div class="kotak_kedua">kotak 2</div>
        <div class="kotak_ketiga">kotak 3</div>
        <div class="kotak_keempat">kotak 4</div>
        <div class="kotak_kelima">kotak 5</div>
        <div class="kotak_kelima">kotak 6</div>
    </section>
</body>

</html>
