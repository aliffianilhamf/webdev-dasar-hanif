<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan class selector</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

        .merah {
            background-color: red;
        }

        .hijau {
            background-color: green;
        }

        .orange {
            background-color: orange;
        }
    </style>
</head>

<body>
    <div class="merah">Kotak 1</div>
    <div class="hijau">Kotak 2</div>
    <div class="merah">Kotak 3</div>
    <div class="hijau">Kotak 4</div>
    <div class="orange">Kotak 5</div>
</body>

</html>
