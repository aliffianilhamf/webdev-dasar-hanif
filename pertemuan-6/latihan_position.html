<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Position dan Z-Index</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        /* Container menggunakan relative sebagai acuan (anchor) untuk elemen absolute di dalamnya */
        .container {
            width: 500px;
            height: 400px;
            background-color: #ffffff;
            border: 2px dashed #333;
            margin: 20px auto;
        }


        /* --- AREA LATIHAN CSS --- */
    </style>
</head>

<body>

    <h2 style="text-align: center;">Latihan Position & Z-Index</h2>
    <p style="text-align: center;">Edit file ini di text editor untuk menyelesaikan tantangan di bawah.</p>

    <div class="container">
        <div class="box kotak-merah">Merah</div>
        <div class="box kotak-biru">Biru</div>
        <div class="box kotak-hijau">Hijau</div>
    </div>

    <div class="box kotak-kuning">Fixed</div>

    <!-- Elemen ini hanya untuk memanjangkan halaman agar efek fixed terlihat -->
    <div style="height: 1000px;"></div>

</body>

</html>
