<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Position dan Z-Index</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        /* Container menggunakan relative sebagai acuan (anchor) untuk elemen absolute di dalamnya */
        .container {
            position: relative;
            width: 500px;
            height: 400px;
            background-color: #ffffff;
            border: 2px dashed #333;
            margin: 20px auto;
        }

        .box {
            width: 150px;
            height: 150px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* --- AREA LATIHAN CSS --- */

        .kotak-merah {
            position: absolute;
            top: 50px;
            left: 50px;
            background-color: #e74c3c;
            z-index: 2;
            /* Coba ubah angka ini */
        }

        .kotak-biru {
            position: absolute;
            top: 100px;
            left: 100px;
            background-color: #3498db;
            z-index: 1;
            /* Coba ubah angka ini */
        }

        .kotak-hijau {
            position: absolute;
            top: 150px;
            left: 150px;
            background-color: #2ecc71;
            z-index: 3;
            /* Coba ubah angka ini */
        }

        .kotak-kuning {
            position: fixed;
            /* Akan selalu menempel di layar meski di-scroll */
            bottom: 20px;
            right: 20px;
            background-color: #f1c40f;
            color: #333;
            z-index: 999;
        }
    </style>
</head>

<body>

    <h2 style="text-align: center;">Latihan Position & Z-Index</h2>
    <p style="text-align: center;">Edit file ini di text editor untuk menyelesaikan tantangan di bawah.</p>

    <div class="container">
        <div class="box kotak-merah">Merah</div>
        <div class="box kotak-biru">Biru</div>
        <div class="box kotak-hijau">Hijau</div>
    </div>

    <div class="box kotak-kuning">Fixed</div>

    <!-- Elemen ini hanya untuk memanjangkan halaman agar efek fixed terlihat -->
    <div style="height: 1000px;"></div>

</body>

</html>
