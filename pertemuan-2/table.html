<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>


    <style>
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

<body>
    <h3>Daftar Siswa</h3>
    <table>
        <thead>
            <tr>
                <td>No.</td>
                <td>Nama</td>
                <td>Nilai</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Aliffian</td>
                <td>90</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Luki</td>
                <td>80</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Imam</td>
                <td>70</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
