<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>

<body>
    <!-- unordered List -->
    <h3>Daftar Belanja</h3>
    <ul>
        <li>apel</li>
        <li>mangga</li>
        <li>anggur</li>
    </ul>

    <!-- ordered list -->
    <h3>Langkah membuat kopi</h3>
    <ol>
        <li>Siapkan cangkir</li>
        <li>masukkan kopi dan gula</li>
        <li>Tuangkan air panas</li>
        <li>Aduk hingga rata</li>
    </ol>

</body>

</html>
